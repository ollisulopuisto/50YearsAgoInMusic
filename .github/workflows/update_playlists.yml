name: Weekly Playlist Update

on:
  schedule:
    # 09:00 UTC every Monday
    - cron: '0 9 * * 1'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  update-playlists:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python and dependencies
        run: uv sync --all-groups

      - name: Restore Spotify Auth Cache
        env:
          CACHE_DATA: ${{ secrets.SPOTIFY_CACHE_DATA }}
        run: |
          echo "$CACHE_DATA" > .cache-dst
          chmod 600 .cache-dst

      - name: Run Playlist Update
        env:
          SPOTIPY_CLIENT_ID: ${{ secrets.SPOTIPY_CLIENT_ID }}
          SPOTIPY_CLIENT_SECRET: ${{ secrets.SPOTIPY_CLIENT_SECRET }}
          SPOTIPY_REDIRECT_URI: ${{ secrets.SPOTIPY_REDIRECT_URI }}
          SPOTIFY_USER: ${{ secrets.SPOTIFY_USER }}
          LOCALE: fi
        run: uv run python update_radio.py
